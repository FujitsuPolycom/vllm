services:
  glm52-sparse-ckv:
    build:
      context: .
      args:
        BASE_IMAGE: voipmonitor/vllm@sha256:41078d5fac36b802e0f3798057a4b383c24296cb8570f6f4fc138c34d8cfa303
        VLLM_BASE_REF: 7ea567a2458a4800a6a0e3e0a6ba41fcbd00d146
        VLLM_REF: 309e95335058fecc1ae5030171a80309c04b91e8
        SPARKINFER_REF: 001443802832538289f8032cb0d60bfe5ef8f468
        RUN_CPU_TESTS: "1"
    image: ${IMAGE_NAME:-fujitsupolycom/glm52-sparse-ckv:latest-upstream-20260721}
    container_name: glm52-sparse-ckv-integration
    entrypoint: ["/usr/local/bin/serve-glm52-sparse-ckv.sh"]
    network_mode: host
    ipc: host
    privileged: true
    init: true
    shm_size: 32gb
    gpus: all
    restart: "no"
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      MODEL_FAMILY: glm52-hybrid
      MODEL: /model
      GPUS: ${CUDA_VISIBLE_DEVICES:-0,1,2,3}
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1,2,3}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_DEVICE_MAX_CONNECTIONS: "32"
      CUTE_DSL_ARCH: sm_120a
      TORCH_CUDA_ARCH_LIST: 12.0a
      OMP_NUM_THREADS: "16"
      PORT: ${PORT:-5803}
      TP: "4"
      DCP: "4"
      DCP_BACKEND: a2a
      DCP_A2A_MAX_TOKENS: "16"
      DCP_A2A_LARGE_BACKEND: ag_rs
      MTP: "3"
      MAX_NUM_SEQS: "8"
      GRAPH: "32"
      MAX_MODEL_LEN: "300000"
      MAX_BATCHED_TOKENS: "2048"
      GPU_MEMORY_UTILIZATION: "0.98"
      KV_CACHE_MEMORY_BYTES: "3426112942"
      MOE_MODE: a16
      QUANTIZATION: nvfp4_nf3_hybrid
      ONLINE_QUANT: nf3-mxfp8
      KV_CACHE_DTYPE: nvfp4_ds_mla
      KV_FP8_ROPE: "0"
      NF3_GRID188: "1"
      VLLM_NF3_GRID188_DECODE: "1"
      B12X_DENSE_SPLITK_TURBO: "1"
      B12X_MLA_SM120_UNIFIED: "1"
      B12X_MOE_FORCE_A16: "1"
      B12X_MOE_FORCE_A8: "0"
      B12X_W4A16_TC_DECODE: "1"
      B12X_W4A8_TINY_DECODE: "1"
      LOAD_FORMAT: instanttensor
      INSTANTTENSOR_BACKEND: BUFFERED
      ALLREDUCE_MODE: nccl
      F8_DMA: "0"
      B12X_PCIE_DMA: "0"
      VLLM_USE_B12X_PCIE_DMA: "0"
      VLLM_ENABLE_PCIE_ALLREDUCE: "0"
      VLLM_ALLOW_CUSTOM_ALLREDUCE_PCIE: "0"
      VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
      VLLM_USE_B12X_WO_PROJECTION: "1"
      VLLM_USE_B12X_MHC: "1"
      VLLM_USE_B12X_FP8_GEMM: "1"
      VLLM_USE_B12X_MOE: "1"
      VLLM_USE_B12X_SPARSE_INDEXER: "1"
      VLLM_USE_B12X_DCP_A2A: "1"
      VLLM_DCP_A2A_MAX_TOKENS: "16"
      VLLM_DCP_A2A_LARGE_BACKEND: ag_rs
      VLLM_DCP_PROJECT_BEFORE_MERGE: "1"
      VLLM_DCP_PROJECT_BEFORE_MERGE_MIN_PREFILL_TOKENS: "1024"
      VLLM_B12X_MLA_DCP_GATHER_IN_WORKSPACE: "1"
      VLLM_DCP_GLOBAL_TOPK: "1"
      VLLM_DCP_REPLICATE_INDEXER_CACHE: "1"
      VLLM_DCP_SHARD_DRAFT: "1"
      DCP_PREFILL_WORKSPACE: "1"
      DCP_QUERY_SPLIT: "0"
      VLLM_DCP_QUERY_SPLIT: "0"
      DCP_CKV_GATHER: "1"
      VLLM_B12X_MLA_CKV_GATHER: "1"
      VLLM_B12X_MLA_CKV_GATHER_MIN_TOKENS: "16"
      VLLM_B12X_MLA_CKV_GATHER_MAX_TOKENS: "300000"
      VLLM_B12X_MLA_CKV_PREFETCH_DEPTH: "3"
      VLLM_B12X_MLA_SPARSE_DECODE_CKV_GATHER: "1"
      VLLM_B12X_MLA_SPARSE_DECODE_TRANSPORT: ce
      VLLM_B12X_MLA_SPARSE_DECODE_BULK_PREFETCH: "1"
      VLLM_B12X_MLA_SPARSE_DECODE_MAX_SEQS: "8"
      VLLM_B12X_MLA_SPARSE_DECODE_POOL_RECORDS: "0"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      VLLM_DISABLED_KERNELS: MarlinFP8ScaledMMLinearKernel
      VLLM_DISABLE_SHARED_EXPERTS_STREAM: "0"
      VLLM_USE_AOT_COMPILE: "1"
      VLLM_USE_V2_MODEL_RUNNER: "1"
      VLLM_USE_BREAKABLE_CUDAGRAPH: "0"
      VLLM_USE_MEGA_AOT_ARTIFACT: "1"
      VLLM_USE_FLASHINFER_SAMPLER: "1"
      VLLM_WORKER_MULTIPROC_METHOD: spawn
      VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "1"
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      SAFETENSORS_FAST_GPU: "1"
      NCCL_IB_DISABLE: "1"
      NCCL_P2P_LEVEL: SYS
      NCCL_PROTO: LL,LL128,Simple
      NCCL_SOCKET_IFNAME: lo
      GLOO_SOCKET_IFNAME: lo
      XDG_CACHE_HOME: /cache
      VLLM_CACHE_DIR: /cache/jit/vllm
      TRITON_CACHE_DIR: /cache/triton
      TORCHINDUCTOR_CACHE_DIR: /cache/torchinductor
      TORCH_EXTENSIONS_DIR: /cache/jit/torch_extensions
      TMPDIR: /container-tmp
    volumes:
      - ${MODEL_PATH:?set MODEL_PATH in .env}:/model:ro
      - ${HF_CACHE_PATH:-/srv/ai/huggingface}:/root/.cache/huggingface
      - ${CACHE_PATH:-/srv/ai/cache/glm52-sparse-ckv-integration}:/cache
      - ${TMP_PATH:-/srv/ai/tmp/glm52-sparse-ckv-integration}:/container-tmp
